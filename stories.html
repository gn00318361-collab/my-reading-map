<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>奇遇的故事銀行 | 52週精英日課</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #fffbf8;
            --text-main: #2c2c2c;
            --text-sub: #7a7a7a;
            --accent: #d4a373;
            --card-bg: #ffffff;
            --line: #f1e9e2;
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            line-height: 1.8;
            -webkit-font-smoothing: antialiased;
        }

        header {
            max-width: 900px;
            margin: 0 auto;
            padding: 100px 20px 60px 20px;
            text-align: center;
        }

        header h1 {
            font-family: 'Noto Serif TC', serif;
            font-size: 3.2rem;
            margin: 0;
            color: #4a4a4a;
            letter-spacing: 2px;
        }

        header p {
            font-size: 1.2rem;
            color: var(--text-sub);
            margin-top: 20px;
            font-weight: 300;
        }

        .nav-filter {
            max-width: 900px;
            margin: 0 auto 50px auto;
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            position: sticky;
            top: 20px;
            z-index: 100;
        }

        .filter-btn {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid var(--line);
            padding: 8px 20px;
            border-radius: 25px;
            cursor: pointer;
            color: var(--text-sub);
            transition: all 0.3s;
            font-size: 0.9rem;
        }

        .filter-btn.active, .filter-btn:hover {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
            box-shadow: 0 4px 15px rgba(212, 163, 115, 0.3);
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 20px;
            display: grid;
            gap: 40px;
        }

        .story-item {
            background: var(--card-bg);
            padding: 50px;
            border-radius: 24px;
            box-shadow: 0 15px 45px rgba(0,0,0,0.02);
            border: 1px solid var(--line);
            transition: all 0.4s ease;
        }

        .story-item:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 60px rgba(212, 163, 115, 0.1);
        }

        .story-meta {
            font-size: 0.85rem;
            color: var(--accent);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
        }

        .story-content h2 {
            font-family: 'Noto Serif TC', serif;
            font-size: 2.2rem;
            margin: 0 0 25px 0;
            color: #333;
            line-height: 1.3;
        }

        .story-body {
            font-size: 1.1rem;
            color: #4a4a4a;
            text-align: justify;
            white-space: pre-wrap;
        }

        .wan-insight {
            margin-top: 30px;
            padding: 25px;
            background: #fffaf5;
            border-radius: 15px;
            border-left: 4px solid var(--accent);
            color: #444;
        }

        .wan-insight b {
            display: block;
            font-weight: 700;
            color: var(--accent);
            font-size: 0.95rem;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 50px;
            color: var(--text-sub);
            text-decoration: none;
            font-size: 0.9rem;
        }
        .back-home:hover { color: var(--accent); }

        footer {
            margin: 100px 0 50px 0;
            text-align: center;
            color: var(--text-sub);
            font-size: 0.9rem;
        }

        @media (max-width: 600px) {
            .story-item { padding: 30px; }
            header h1 { font-size: 2.2rem; }
            .story-content h2 { font-size: 1.6rem; }
        }
    </style>
</head>
<body>

    <header>
        <h1>🏦 奇遇的故事銀行</h1>
        <p>52週精英日課計畫：在數據中尋找溫度，在混亂中建立模型。</p>
    </header>

    <div class="nav-filter">
        <button class="filter-btn active" onclick="render('all')">年度總覽</button>
        <button class="filter-btn" onclick="render('教育')">教育研究</button>
        <button class="filter-btn" onclick="render('趨勢')">2026趨勢</button>
        <button class="filter-btn" onclick="render('歷史')">歷史翻案</button>
    </div>

    <div class="container" id="story-grid">
        <!-- 內容由 JS 加載 -->
    </div>

    <a href="index.html" class="back-home">← 返回思維空間首頁</a>

    <footer>
        &copy; 2026 奇遇的故事銀行 - 讓閱讀與生命對話
    </footer>

    <script>
        const stories = [
            {
                week: 5,
                category: "趨勢",
                title: "代理人的悖論：當 AI 幫你處理了所有瑣事，你失去了什麼？",
                body: "2026 年，波士頓的一家科技創業公司推出了一項名為「全能代理」的服務。目標是透過 Agentic AI 接管用戶所有的低價值活動。初步結果非常完美，用戶平均每天多出了 3 小時的「淨自由時間」。\n\n然而，反直覺的阻礙出現了。在心理調查中，這群人不但沒有變得更快樂，反而產生了強烈的「生活脫節感」。數據顯示，由於失去了與瑣事博弈的過程，用戶對於生活成果的掌控感下降了 40%。\n\n公司決定在流程中刻意注入了「人工介入點」。AI 不再全自動完成任務，而是會將關鍵的決策權留給用戶，甚至會模擬一些微小的「麻煩」需要用戶解決。意外發生在一個平凡的下午，一位用戶在與 AI 共同處理旅行計畫時，因為刻意的「難題」，引發了與伴侶一場深入的對話。\n\n這個轉彎揭示了一個深刻的道理：生活的意義並非存在於結果中，而是存在於處理瑣碎混亂的過程裡。最終，這項研究定義了 2026 年的高級自動化原則：最好的技術不是幫你消除麻煩，而是幫你「篩選麻煩」。",
                insight: "<b>奇遇·深度觀察</b>這是一個典型的『幸福感補償模型』。在極致自動化的未來，我們必須學會分辨什麼是『無意義的體力消耗』，什麼是『建構自我的生命體驗』。將後者外包出去，是一筆賠本生意。"
            },
            {
                week: 4,
                category: "教育",
                title: "必要的難度：為什麼「太好懂」是學習的災難？",
                body: "根據 2025 年《實驗心理學期刊》的研究，數位教學工具讓知識獲取變得「太過順滑」。目標原本是降低門檻，但阻礙在於，當阻力消失時，大腦會進入一種「認知的流暢錯覺」。學生以為看懂了就掌握了知識，但實際測試顯示保留期不超過 48 小時。\n\n研究團隊引入了「刻意干擾」法，故意加入一些障礙：如模糊的字體、打亂的段落。結果顯示，這群在「困難模式」下學習的學生，長期記憶的穩固程度是普通組的 3 倍。意外在於，他們的「遷移應用能力」也得到了顯著提升。\n\n這個轉彎告訴我們：大腦的神經連結必須在「摩擦力」中才能生成。當我們試圖幫孩子掃除一切障礙時，我們其實是在剝奪他們強大起來的權利。",
                insight: "<b>奇遇·深度觀察</b>在 2026 年，『易用性』是產品的優點，卻是教育的毒藥。真正的精英教育，是在安全受控的環境下，為大腦製造最精確的負擔。"
            },
            {
                week: 3,
                category: "科技",
                title: "孤獨的溢價：為什麼 2026 年，「真實的連結」變成了奢侈品？",
                body: "在 2026 年的東京，一款完美的「AI 伴侶」上線了。目標是處理人類所有的孤獨感。數據顯示，用戶確實感到了短暫的心理寬慰。但產品經理發現，現實世界的空虛感卻在增加。他決定回歸原始，參加一場不完美的實體課程。在那裡，他遇到了一個會流淚、會失誤的真人老師。\n\n老師在課程結束時送給他一個歪歪斜斜的杯子，並說：「這杯子會漏水，就像人一樣，但不完美才是活過的證據。」這成了故事中最重要的轉彎。他回到公司後，不再追求「完美回覆」，而是注入了大量「情緒雜訊」。意外的是，用戶之間的真實互動率反而提升了。",
                insight: "<b>奇遇·深度觀察</b>價值的核心來源於『攻擊稀缺』。當完美的模擬變得廉價時，真實的混亂和有溫度的瑕疵反而會產生高昂的溢價。這就是 2026 年的數位邊際效應。"
            },
            {
                week: 2,
                category: "歷史",
                title: "勤政的詛咒：崇禎皇帝為何救不了大明？",
                body: "崇禎皇帝朱由檢，接手的是一個爛攤子。與以往亡國之君不同，他極度勤政，目標只有一個：中興大明。然而，這種勤政卻變成了一種多疑的詛咒，他頻繁更換內閣，處決將領，摧毀了系統最後的容錯空間。\n\n意外發生在 1644 年，外敵逼近時，原本唯唯諾諾的群臣竟然全體沈默。崇禎成了名副其實的孤家寡人。這個案例最深刻的轉彎在於：他一直以為失敗是手下人偷懶，卻沒看到當時處於全球性的『小冰河期』極端災害。在極端環境下，領袖需要的是尋求系統韌性，而非個人加倍努力。",
                insight: "<b>奇遇·深度觀察</b>這是一個關於『勤奮的人在錯誤模型中加速』的悲劇。真正的進化懂得跳出既定模型去觀察規律，而不是在沈船上把地板擦得更亮。"
            },
            {
                week: 1,
                category: "教育",
                title: "為什麼 2026 年，最頂級的教育反而是在「製造麻煩」？",
                body: "一位父親為兒子配戴了強大的 AI 導師，目標是領先入學。但兒子對世界的感知卻被資訊外包。大衛強制關閉搜尋功能，改為啟發模式。意外發生在深山露營，導師失效，兒子面對發光甲蟲卻大哭大鬧，因為沒有標籤。\n\n那一瞬間，轉彎發生了：大衛發現他訓練出的並不是一個有好奇心的靈魂，而是一個對『標準答案』極度成癮的機器。",
                insight: "<b>奇遇·深度觀察</b>我們正陷入『認知的透明化陷阱』。當技術讓知識變得太過零阻力時，我們其實是在剝奪個體建立內部獎勵系統的機會。真正的精英，是那個能忍受混亂的人。"
            }
        ];

        function render(filter) {
            const grid = document.getElementById('story-grid');
            grid.innerHTML = '';
            const filtered = filter === 'all' ? stories : stories.filter(s => s.category === filter);
            filtered.forEach(s => {
                const div = document.createElement('div');
                div.className = 'story-item';
                div.innerHTML = `
                    <div class="story-meta">Week ${s.week} • ${s.category}</div>
                    <div class="story-content">
                        <h2>${s.title}</h2>
                        <div class="story-body">${s.body}</div>
                        <div class="wan-insight">${s.insight}</div>
                    </div>
                `;
                grid.appendChild(div);
            });
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.toggle('active', btn.innerText.includes(filter) || (filter === 'all' && btn.innerText === '年度總覽'));
            });
        }
        render('all');
    </script>
</body>
</html>
