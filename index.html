<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>奇遇的思維空間</title>
<style>
    body {
        font-family: "Microsoft JhengHei", sans-serif;
        margin: 0;
        padding: 0;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
    }
    .container {
        display: flex;
        gap: 40px;
        max-width: 1200px;
        width: 90%;
        flex-wrap: wrap;
        justify-content: center;
    }
    .card {
        background: white;
        border-radius: 20px;
        padding: 40px;
        width: 350px;
        text-align: center;
        text-decoration: none;
        color: #333;
        box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        transition: transform 0.3s ease, box-shadow 0.3s ease;
        display: flex;
        flex-direction: column;
        align-items: center;
        cursor: pointer;
    }
    .card:hover {
        transform: translateY(-10px);
        box-shadow: 0 20px 40px rgba(0,0,0,0.15);
    }
    .icon {
        font-size: 80px;
        margin-bottom: 20px;
    }
    h2 {
        margin: 10px 0;
        font-size: 2rem;
    }
    p {
        color: #666;
        font-size: 1.1rem;
        line-height: 1.5;
    }
    .btn {
        margin-top: 30px;
        padding: 12px 30px;
        border-radius: 50px;
        color: white;
        font-weight: bold;
        text-transform: uppercase;
        letter-spacing: 1px;
        transition: opacity 0.3s;
    }
    .card-map h2 { color: #3f51b5; }
    .card-map .btn { background: linear-gradient(to right, #3f51b5, #5c6bc0); }
    
    .card-story h2 { color: #e65100; }
    .card-story .btn { background: linear-gradient(to right, #ff9800, #ffb74d); }

    .card-weekly h2 { color: #1b5e20; }
    .card-weekly .btn { background: linear-gradient(to right, #43a047, #66bb6a); }

    .card:hover .btn { opacity: 0.9; }

    @media (max-width: 768px) {
        .container { flex-direction: column; align-items: center; }
        .card { width: 100%; max-width: 320px; }
    }
</style>
</head>
<body>

<div class="container">
    <!-- Map Card -->
    <a href="map.html" class="card card-map">
        <div class="icon">🌟</div>
        <h2>思維宇宙</h2>
        <p>探索 50+ 篇閱讀心得與生活筆記<br>視覺化知識脈絡</p>
        <div class="btn">進入心智圖</div>
    </a>

    <!-- Story Card -->
    <a href="stories.html" class="card card-story">
        <div class="icon">🎤</div>
        <h2>故事銀行</h2>
        <p>收藏人生經歷與教學現場的感動<br>隨時提取靈感素材</p>
        <div class="btn">開啟故事庫</div>
    </a>

    <!-- Weekly Card -->
    <a href="weekly.html" class="card card-weekly">
        <div class="icon">📚</div>
        <h2>52週精英日課</h2>
        <p>每週一篇深度思考<br>在數據中尋找溫度，在混亂中建立模型</p>
        <div class="btn">進入日課</div>
    </a>
</div>

</body>
</html>
